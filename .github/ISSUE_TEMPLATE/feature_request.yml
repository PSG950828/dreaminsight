name: "Feature Request"
description: "새로운 기능/개선 제안을 남깁니다."
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 배경/문제
      placeholder: 예) 업로드 실패 사유를 사용자에게 더 친절히 안내하고 싶다
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안(솔루션)
      placeholder: 예) 업로드 에러 코드를 맵핑해 UX 토스트 + 재시도 버튼 제공
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위(Out of Scope 포함)
  - type: textarea
    id: success
    attributes:
      label: 성공 기준
      placeholder: 정량/정성 지표(예: 업로드 재시도 성공률 +10pp)
  - type: textarea
    id: risks
    attributes:
      label: 리스크/의존성
  - type: textarea
    id: metrics
    attributes:
      label: 지표/텔레메트리
      placeholder: /stats에서 확인할 카드/시계열/이벤트 정의
  - type: textarea
    id: rollout
    attributes:
      label: 롤아웃/AB 계획
      placeholder: A/B 링크 or 점진 배포, 롤백 조건

