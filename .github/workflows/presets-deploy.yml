name: Presets — Deploy (Staging/Prod)

on:
  workflow_dispatch:
    inputs:
      preset:
        description: 'Preset (staging=preview, production=prod)'
        required: true
        default: 'staging'
        type: choice
        options: [ 'staging', 'production' ]
      create_release:
        description: 'Create a release after deploy (true|false)'
        required: false
        default: 'false'
        type: choice
        options: [ 'true', 'false' ]
      admin_password:
        description: 'ADMIN_PASSWORD for post-deploy ops (optional)'
        required: false
        type: string
      user_uid:
        description: 'USER_UID for RL/CSRF test (optional)'
        required: false
        type: string
      stripe_webhook_secret:
        description: 'STRIPE_WEBHOOK_SECRET for webhook replay (optional)'
        required: false
        type: string

jobs:
  dispatch-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Compute inputs
        id: cfg
        run: |
          if [ "${{ inputs.preset }}" = "production" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "thr_unknown=0.15" >> $GITHUB_OUTPUT
            echo "thr_fail=0.10" >> $GITHUB_OUTPUT
          else
            echo "env=preview" >> $GITHUB_OUTPUT
            echo "thr_unknown=0.20" >> $GITHUB_OUTPUT
            echo "thr_fail=0.12" >> $GITHUB_OUTPUT
          fi

      - name: Dispatch Deploy — Vercel workflow
        uses: peter-evans/workflow-dispatch@v2
        with:
          workflow: dev/dreaminsight/.github/workflows/deploy-vercel.yml
          ref: ${{ github.ref }}
          inputs: |
            environment: "${{ steps.cfg.outputs.env }}"
            notify: "true"
            admin_password: "${{ inputs.admin_password }}"
            user_uid: "${{ inputs.user_uid }}"
            stripe_webhook_secret: "${{ inputs.stripe_webhook_secret }}"
            unknown_rate_threshold: "${{ steps.cfg.outputs.thr_unknown }}"
            upload_fail_rate_threshold: "${{ steps.cfg.outputs.thr_fail }}"

      - name: Dispatch Release (optional)
        if: ${{ inputs.create_release == 'true' }}
        uses: peter-evans/workflow-dispatch@v2
        with:
          workflow: dev/dreaminsight/.github/workflows/release.yml
          ref: ${{ github.ref }}
          inputs: |
            tag_name: "di-v${{ github.run_id }}"
            release_name: "DreamInsight Automated Release (run ${{ github.run_id }})"
