name: Deploy — Vercel (App: dev/dreaminsight)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Vercel environment (preview|production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      notify:
        description: 'Send Slack/Discord notifications (true|false)'
        required: false
        default: 'true'
        type: choice
        options: [ 'true', 'false' ]
      admin_password:
        description: 'ADMIN_PASSWORD for ops smoke (optional)'
        required: false
        type: string
      user_uid:
        description: 'Test USER_UID for ops RL/CSRF (optional)'
        required: false
        type: string
      stripe_webhook_secret:
        description: 'STRIPE_WEBHOOK_SECRET for webhook replay (optional)'
        required: false
        type: string
      unknown_rate_threshold:
        description: 'Alert threshold for unknownRate (0~1)'
        required: false
        default: '0.15'
        type: string
      upload_fail_rate_threshold:
        description: 'Alert threshold for upload fail rate (0~1)'
        required: false
        default: '0.10'
        type: string

jobs:
  deploy:
    concurrency:
      group: deploy-${{ github.ref }}-${{ inputs.environment }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dev/dreaminsight/package-lock.json

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel Environment Info
        run: vercel pull --yes --environment=${{ inputs.environment }} --token=${{ env.VERCEL_TOKEN }}

      - name: Install deps
        run: npm ci

      - name: Build with Vercel (prebuilt output)
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            vercel build --prod --token=${{ env.VERCEL_TOKEN }}
          else
            vercel build --token=${{ env.VERCEL_TOKEN }}
          fi

      - name: Deploy to Vercel
        id: deploy
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            url=$(vercel deploy --prebuilt --prod --token=${{ env.VERCEL_TOKEN }})
          else
            url=$(vercel deploy --prebuilt --token=${{ env.VERCEL_TOKEN }})
          fi
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Output Deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"

      - name: Ops Health (post-deploy)
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          ADMIN_PASSWORD: ${{ inputs.admin_password || '' }}
        run: npm run ops:health

      - name: Ops RL/CSRF (post-deploy)
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          USER_UID: ${{ inputs.user_uid || format('u_deploy_{0}', github.run_id) }}
        run: npm run ops:rl-csrf

      - name: Ops Stripe Webhook Replay (optional)
        if: ${{ inputs.stripe_webhook_secret != '' }}
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          STRIPE_WEBHOOK_SECRET: ${{ inputs.stripe_webhook_secret }}
        run: |
          npm run ops:webhook:replay -- ${{ inputs.user_uid || format('u_deploy_{0}', github.run_id) }} 30

      - name: Fetch KPIs (7d)
        id: kpi
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          THR_UNKNOWN: ${{ inputs.unknown_rate_threshold || '0.15' }}
          THR_FAIL: ${{ inputs.upload_fail_rate_threshold || '0.10' }}
        run: |
          set -e
          J=$(curl -s "$BASE_URL/api/stats/kpi?days=7" || echo '{}')
          UNK=$(echo "$J" | jq -r '.unknownRate // -1')
          UNKT=$(echo "$J" | jq -r '.unknownTotal // 0')
          UPS=$(echo "$J" | jq -r '.upload.ok // 0')
          UPF=$(echo "$J" | jq -r '.upload.fail // 0')
          FB=$(echo "$J" | jq -r '(.upload.failBreakdown // {}) | to_entries | sort_by(-.value) | .[0:2] | map("\(.key):\(.value)") | join(", ")')
          FR=$(echo "$J" | jq -r '.upload.failRate // ""')
          if [ -n "$FR" ] && [ "$FR" != "" ]; then FAILRATE="$FR"; else TOT=$((UPS+UPF)); if [ "$TOT" -gt 0 ]; then FAILRATE=$(python3 - <<PY
tot=$TOT; upf=$UPF
print(round(upf/tot,3))
PY
          ); else FAILRATE=-1; fi; fi
          ALERT=0
          # thresholds: unknownRate>THR_UNKNOWN or failRate>THR_FAIL
          awk -v t="$THR_UNKNOWN" "BEGIN{if($UNK>t) exit 0; exit 1}" >/dev/null 2>&1 && ALERT=1
          if [ "$FAILRATE" != "-1" ]; then awk -v t="$THR_FAIL" "BEGIN{if($FAILRATE>t) exit 0; exit 1}" >/dev/null 2>&1 && ALERT=1; fi
          TXT="unknownRate=$( [ "$UNK" = "-1" ] && echo N/A || echo $UNK ), unknown=$UNKT, upload ok=$UPS, fail=$UPF$( [ "$FAILRATE" = "-1" ] && echo '' || echo ", failRate=$FAILRATE" )$( [ -n "$FB" ] && echo ", failTop: $FB" )"
          echo "kpi_text=$TXT" >> $GITHUB_OUTPUT
          echo "kpi_alert=$ALERT" >> $GITHUB_OUTPUT
      - name: Fetch Funnel (7d)
        id: funnel
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -e
          J=$(curl -s "$BASE_URL/api/stats/funnel?days=7" || echo '{}')
          CCLICK=$(echo "$J" | jq -r '[.upsell.click[]?.count]|add // 0')
          CSUCC=$(echo "$J" | jq -r '.checkout.success // 0')
          RAT=$(python3 - <<PY
clicks=${CCLICK}
succ=${CSUCC}
print(0 if clicks==0 else round(succ/clicks,3))
PY
          )
          echo "funnel_click=$CCLICK" >> $GITHUB_OUTPUT
          echo "funnel_success=$CSUCC" >> $GITHUB_OUTPUT
          echo "funnel_rate=$RAT" >> $GITHUB_OUTPUT

      - name: Notify Slack (optional)
        if: ${{ inputs.notify == 'true' && success() && secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          KPI_ICON=""; [ "${{ steps.kpi.outputs.kpi_alert }}" = "1" ] && KPI_ICON=" ⚠️"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="🚀 Deployed to ${{ inputs.environment }}: ${{ steps.deploy.outputs.url }}\n(ops) health/rl-csrf completed\nKPI(7d)${KPI_ICON}: ${{ steps.kpi.outputs.kpi_text }}\nRun: ${RUN_URL}"
          if [ -n "${{ steps.funnel.outputs.funnel_rate }}" ]; then
            TEXT="$TEXT\nFunnel(7d): click=${{ steps.funnel.outputs.funnel_click }}, success=${{ steps.funnel.outputs.funnel_success }}, rate=${{ steps.funnel.outputs.funnel_rate }}"
          fi
          curl -s -X POST -H 'Content-type: application/json' --data "$(jq -nc --arg text "$TEXT" '{text:$text}')" "$SLACK_WEBHOOK_URL"

      - name: Notify Discord (optional)
        if: ${{ inputs.notify == 'true' && success() && secrets.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          KPI_ICON=""; [ "${{ steps.kpi.outputs.kpi_alert }}" = "1" ] && KPI_ICON=" ⚠️"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CONTENT="🚀 Deployed to ${{ inputs.environment }}: ${{ steps.deploy.outputs.url }}\n(ops) health/rl-csrf completed\nKPI(7d)${KPI_ICON}: ${{ steps.kpi.outputs.kpi_text }}\nRun: ${RUN_URL}"
          if [ -n "${{ steps.funnel.outputs.funnel_rate }}" ]; then
            CONTENT="$CONTENT\nFunnel(7d): click=${{ steps.funnel.outputs.funnel_click }}, success=${{ steps.funnel.outputs.funnel_success }}, rate=${{ steps.funnel.outputs.funnel_rate }}"
          fi
          curl -s -H "Content-Type: application/json" -d "$(jq -nc --arg content "$CONTENT" '{content:$content}')" "$DISCORD_WEBHOOK_URL"

      - name: Create KPI Alert Issue (optional)
        if: ${{ steps.kpi.outputs.kpi_alert == '1' }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = `KPI Alert after Deploy: ${process.env.GITHUB_RUN_ID}`;
            const body = [
              `Base: ${{ steps.deploy.outputs.url }}`,
              `KPI(7d): ${{ steps.kpi.outputs.kpi_text }}`,
              `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            const labels = ['ops','incident'];
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels });
