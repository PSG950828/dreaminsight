name: Ops — Coverage Ingest

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days lookback'
        required: false
        default: '14'
        type: string
      limit:
        description: 'Max tokens'
        required: false
        default: '500'
        type: string
      min:
        description: 'Min count per token'
        required: false
        default: '3'
        type: string

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/dreaminsight
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dev/dreaminsight/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Run coverage ingest
        env:
          BASE_URL: ${{ secrets.OPS_BASE_URL }}
          ADMIN_PASSWORD: ${{ secrets.OPS_ADMIN_PASSWORD }}
          DAYS: ${{ inputs.days }}
          LIMIT: ${{ inputs.limit }}
          MIN: ${{ inputs.min }}
        run: npm run -s ops:coverage:ingest

