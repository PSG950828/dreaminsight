name: Release — Notes & Artifacts

on:
  push:
    tags:
      - 'v*.*.*'
      - 'di-v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., di-v20250101-1234)'
        required: true
        type: string
      release_name:
        description: 'Release display name (optional)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    concurrency:
      group: release-${{ env.TAG_NAME }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/dreaminsight
    env:
      TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
      RELEASE_NAME: ${{ inputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dev/dreaminsight/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: ./node_modules/.bin/tsc -p tsconfig.json --noEmit --incremental false

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreaminsight-build-${{ env.TAG_NAME }}
          path: |
            dev/dreaminsight/.next/**
            dev/dreaminsight/next.config.ts
            dev/dreaminsight/.env.production.example
            dev/dreaminsight/PRODUCTION_PROFILE.md
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME || format('DreamInsight {0}', env.TAG_NAME) }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack (optional)
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
          TEXT="🚀 DreamInsight ${TAG_NAME} released by @${{ github.actor }}\n${RELEASE_URL}"
          curl -s -X POST -H 'Content-type: application/json' --data "$(jq -nc --arg text "$TEXT" '{text:$text}')" "$SLACK_WEBHOOK_URL"

      - name: Notify Discord (optional)
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
          CONTENT="🚀 DreamInsight ${TAG_NAME} released by @${{ github.actor }}\n${RELEASE_URL}"
          curl -s -H "Content-Type: application/json" -d "$(jq -nc --arg content "$CONTENT" '{content:$content}')" "$DISCORD_WEBHOOK_URL"

      - name: Notify Generic Webhook (optional)
        if: ${{ secrets.RELEASE_WEBHOOK_URL != '' }}
        env:
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
        run: |
          jq -nc \
            --arg repo "${{ github.repository }}" \
            --arg tag "${TAG_NAME}" \
            --arg actor "${{ github.actor }}" \
            --arg url "https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}" \
            '{event:"release", repo:$repo, tag:$tag, actor:$actor, url:$url, ts: (now|toiso8601)}' \
            | curl -s -H 'Content-Type: application/json' -d @- "$RELEASE_WEBHOOK_URL"
