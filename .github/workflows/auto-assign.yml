name: Auto Assign Reviewers

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Auto assign reviewers
        uses: kentaro-m/auto-assign-action@v2.2.2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: dev/dreaminsight/.github/auto_assign.yml

